name: Build AI Figure Paint APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AI-Figure-Paint-v0.7.4-Fold8-debug.apk
          ls -lh dist/AI-Figure-Paint-v0.7.4-Fold8-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Figure-Paint-v0.7.4-Fold8-APK
          path: dist/AI-Figure-Paint-v0.7.4-Fold8-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.4-build-${{ github.run_number }}
          name: AI Figure Paint v0.7.4 Fold8 · Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: dist/AI-Figure-Paint-v0.7.4-Fold8-debug.apk
