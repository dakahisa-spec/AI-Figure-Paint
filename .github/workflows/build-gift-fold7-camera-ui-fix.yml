name: Build Gift Fold7 Camera UI Fix APK

on:
  workflow_dispatch:
  push:
    branches: [codex/gift-fold7-camera-ui-fix-v082]

permissions:
  contents: write

concurrency:
  group: gift-fold7-camera-ui-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up complete Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Java compiler toolchain
        shell: bash
        run: |
          java -version
          javac -version
          test -x "$JAVA_HOME/bin/javac"
          "$JAVA_HOME/bin/java" --list-modules | grep '^jdk.compiler@'
          echo "Is JDK: true"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0"

      - name: Static source checks
        shell: bash
        run: |
          git diff --check HEAD^
          test "$(grep -c 'android.permission.CAMERA' app/src/main/AndroidManifest.xml)" -eq 1
          ! grep -RInE 'gpt-5[^[:space:]]*sol|MODEL_SOL|AiModelMode\.SOL' app/src/main/java --exclude-dir=build
          ! grep -RInE 'sk-proj-|OPENAI_API_KEY[[:space:]]*=' app README.md build.gradle.kts settings.gradle.kts gradle.properties --exclude-dir=build

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --stop
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          grep -F "package: name='com.aifigurepaint.app.giftlocal' versionCode='24' versionName='0.8.2-gift-fold7-camera-ui-fix'" apk-badging.txt
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AI-Figure-Paint-v0.8.2-Gift-Fold7-Camera-UI-Fix.apk
          sha256sum dist/AI-Figure-Paint-v0.8.2-Gift-Fold7-Camera-UI-Fix.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Figure-Paint-v0.8.2-Gift-Fold7-Camera-UI-Fix-APK
          path: dist/AI-Figure-Paint-v0.8.2-Gift-Fold7-Camera-UI-Fix.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.2-gift-fold7-camera-ui-fix-build-${{ github.run_number }}
          name: AI Figure Paint v0.8.2 Gift Fold7 Camera UI Fix · Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: dist/AI-Figure-Paint-v0.8.2-Gift-Fold7-Camera-UI-Fix.apk
